spring:
  application:
    name: account
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.76:5432/srghaccount}
    username: ${DB_USERNAME:semin5}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 3000
  web:
    resources:
      cache:
        period: 0s
server:
  port: ${PORT:13011}
  servlet:
    context-path: /account
  forward-headers-strategy: framework
